[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chickentruck"
version = "2026.10.9"
description = "Knowledge Engineering for Python — turning information into structured, traceable, queryable knowledge."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Babble Baz", email = "dev@babblebaz.com" }]
keywords = ["knowledge-engineering", "knowledge-graph", "entity-extraction", "provenance", "structured-data", "ontology"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "build", "twine"]

[project.urls]
Homepage = "https://github.com/sgtidwellgit/ChickenTruck"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "assets/",
    "README.md",
    "LICENSE",
    "PROJECT.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chickentruck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
